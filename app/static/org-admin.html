<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Portal · LeadAI</title>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="referrer" content="no-referrer"/>
  <meta name="color-scheme" content="dark light"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="stylesheet" href="/static/design/tokens.css"/>
  <link rel="stylesheet" href="/static/design/components.css"/>
  <link rel="stylesheet" href="/static/org-admin.css"/>
  <script src="/static/design/theme.js"></script>
</head>
<body class="oa">
<a class="skip-link" href="#oa-content">Skip to content</a>

<!-- Boot / gate screen (loading, locked, error) -->
<div id="oa-gate" class="oa-gate" role="status" aria-live="polite">
  <div class="oa-card">
    <div class="oa-state">
      <span class="spinner spinner-lg" aria-hidden="true"></span>
      <p>Loading your Admin portal…</p>
    </div>
  </div>
</div>

<div id="oa-app" class="oa-shell" hidden>
  <aside id="oa-sidebar" class="oa-sidebar" aria-label="Admin navigation">
    <div class="oa-brand">
      <span class="brand-mark" id="oa-org-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.1 6.4 6.4 2.1-6.4 2.1L12 19.5l-2.1-6.4L3.5 11l6.4-2.1z"/></svg></span>
      <img id="oa-org-logo" class="oa-org-logo" alt="" hidden/>
      <div class="oa-brand-text">
        <div class="oa-brand-name" id="oa-org-name">Organization</div>
        <div class="oa-brand-sub">Admin portal</div>
      </div>
    </div>
    <nav class="oa-nav" id="oa-nav" aria-label="Sections"></nav>
    <div class="oa-sidebar-foot">
      <a href="/dashboard">← Open User Portal</a>
      <span>LeadAI · Admin</span>
    </div>
  </aside>
  <div id="oa-scrim" class="oa-scrim" aria-hidden="true"></div>

  <div class="oa-main">
    <header class="oa-topbar">
      <button type="button" class="oa-icon-btn oa-menu-btn" id="oa-menu-btn" aria-label="Open navigation" aria-controls="oa-sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="oa-crumb">
        <div class="oa-crumb-org" id="oa-crumb-org"></div>
        <div class="oa-crumb-title" id="oa-crumb-title">Dashboard</div>
      </div>
      <form class="oa-search" id="oa-search" role="search" autocomplete="off">
        <svg class="oa-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <label class="sr-only" for="oa-search-input">Search users, leads and searches</label>
        <input id="oa-search-input" type="search" placeholder="Search users, leads, searches…" maxlength="120"/>
        <kbd aria-hidden="true">/</kbd>
      </form>
      <button type="button" class="oa-icon-btn oa-search-toggle" id="oa-search-toggle" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button type="button" class="oa-icon-btn theme-toggle" data-theme-toggle aria-label="Switch theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <div class="oa-rel">
        <button type="button" class="oa-icon-btn" id="oa-bell" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" aria-controls="oa-notif-pop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="oa-badge-count" id="oa-bell-count" hidden>0</span>
        </button>
        <div class="oa-pop" id="oa-notif-pop" hidden>
          <div class="oa-pop-head"><span>Notifications</span><button type="button" class="btn btn-ghost btn-sm" id="oa-notif-readall">Mark all read</button></div>
          <div class="oa-pop-list" id="oa-notif-list"></div>
          <div class="oa-pop-foot"><a class="oa-link" href="#notifications">View all notifications</a></div>
        </div>
      </div>
      <div class="oa-rel">
        <button type="button" class="oa-profile-btn" id="oa-profile-btn" aria-haspopup="true" aria-expanded="false" aria-controls="oa-profile-pop">
          <span class="oa-avatar" id="oa-avatar" aria-hidden="true">A</span>
          <span class="oa-profile-name" id="oa-profile-name">Admin</span>
        </button>
        <div class="oa-pop oa-menu" id="oa-profile-pop" hidden role="menu">
          <div class="oa-pop-head oa-menu-head">
            <span id="oa-menu-name">Admin</span><small class="oa-muted oa-small" id="oa-menu-email"></small>
          </div>
          <a class="oa-pop-item" role="menuitem" href="#profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile &amp; security</a>
          <a class="oa-pop-item" role="menuitem" href="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>User portal</a>
          <button type="button" class="oa-pop-item" role="menuitem" data-theme-toggle><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Switch light / dark</button>
          <a class="oa-pop-item" role="menuitem" href="#support"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>Help &amp; support</a>
          <div class="oa-menu-sep"></div>
          <button type="button" class="oa-pop-item" role="menuitem" id="oa-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Sign out</button>
        </div>
      </div>
    </header>
    <main id="oa-content" class="oa-content" tabindex="-1"></main>
  </div>
</div>

<div id="oa-modal-root"></div>
<div class="oa-toasts" id="oa-toasts" role="status" aria-live="polite"></div>
<script src="/static/org-admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" data-appconfig="brand-only">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin · LeadAI</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preload" href="/static/design/tokens.css?v=r1005" as="style">
<link rel="preload" href="/static/design/components.css?v=r1006" as="style">
<link rel="stylesheet" href="/static/design/tokens.css?v=r1005">
<link rel="stylesheet" href="/static/design/components.css?v=r1006">
<link rel="stylesheet" href="/static/design/tour.css?v=tour1">
<script src="/static/design/theme.js?v=r1006" defer></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
<style>
  /* --sa-muted: token-derived muted ink that keeps WCAG AA (≥4.5:1) on dark surfaces too */
  :root{--sa-muted:color-mix(in srgb,var(--text-muted) 40%,var(--text-secondary))}
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5;overflow-x:hidden}
  button{font-family:inherit}
  a{color:var(--text-link)}
  :focus-visible{outline:2px solid var(--primary);outline-offset:2px}

  /* ── Shell ───────────────────────────────────────────── */
  .sa-shell{display:flex;min-height:100vh}
  .sa-sidebar{
    width:252px;flex-shrink:0;
    background:var(--bg-secondary);
    border-right:1px solid var(--border-subtle);
    box-shadow:2px 0 20px rgba(0,0,0,0.18);
    display:flex;flex-direction:column;
    position:fixed;inset:0 auto 0 0;z-index:60;
    transition:width .18s ease,transform .18s ease
  }
  .sa-main{flex:1;min-width:0;margin-left:252px;transition:margin-left .18s ease;display:flex;flex-direction:column;min-height:100vh}
  body.sa-collapsed .sa-sidebar{width:64px}
  body.sa-collapsed .sa-main{margin-left:64px}
  .sa-brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--border)}
  .sa-brand .brand-mark{width:30px;height:30px}
  .sa-brand-text{min-width:0;flex:1}
  .sa-brand-name{font-weight:800;font-size:15px;letter-spacing:-.01em}
  .sa-global{display:inline-flex;align-items:center;gap:5px;margin-top:2px;font-size:10px;font-weight:800;letter-spacing:.12em;padding:2px 7px;border-radius:999px;background:var(--warning-soft);border:1px solid var(--warning-border);color:var(--warning-text)}
  .sa-global::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
  .sa-nav{flex:1;overflow-y:auto;padding:8px 0 12px;scrollbar-width:thin}
  .sa-group{margin-top:6px}
  .sa-group-btn{display:flex;align-items:center;width:100%;gap:6px;background:none;border:0;color:var(--sa-muted);font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px 4px;cursor:pointer;text-align:left}
  .sa-group-btn .chev{margin-left:auto;transition:transform .15s}
  .sa-group.closed .chev{transform:rotate(-90deg)}
  .sa-group.closed .sa-group-items{display:none}
  .sa-item{display:flex;align-items:center;gap:10px;padding:7px 14px 7px 16px;margin:1px 8px;border-radius:8px;color:var(--text-secondary);text-decoration:none;font-size:13px;font-weight:500;cursor:pointer;border:0;background:none;width:calc(100% - 16px);text-align:left}
  .sa-item svg{width:17px;height:17px;flex-shrink:0}
  .sa-item:hover{background:var(--surface-hover);color:var(--text-primary)}
  .sa-item.active{background:var(--primary-light);color:var(--text-primary);box-shadow:inset 3px 0 0 var(--primary)}
  .sa-item .sa-ext{margin-left:auto;opacity:.5;width:12px;height:12px}
  .sa-item .sa-count{margin-left:auto;font-size:11px;font-weight:700;background:var(--danger-soft);color:var(--danger-text);border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
  .sa-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body.sa-collapsed .sa-label,body.sa-collapsed .sa-brand-text,body.sa-collapsed .sa-group-btn span,body.sa-collapsed .sa-group-btn .chev,body.sa-collapsed .sa-item .sa-ext,body.sa-collapsed .sa-item .sa-count{display:none}
  body.sa-collapsed .sa-group.closed .sa-group-items{display:block}
  body.sa-collapsed .sa-group-btn{height:1px;padding:0;margin:8px 14px;background:var(--border)}
  body.sa-collapsed .sa-item{justify-content:center;padding:8px 0}
  .sa-foot{border-top:1px solid var(--border);padding:8px 0}

  .sa-topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px 20px;
    background:color-mix(in srgb,var(--bg-primary) 82%,transparent);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border-subtle)}
  .sa-burger{display:none}
  .sa-crumbs{min-width:0;flex:0 1 auto}
  .sa-tb-title{display:flex;align-items:center;gap:8px;min-width:0}
  #saTitle{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .sa-global-tb{margin-top:0;flex-shrink:0}
  .sa-bc ol{list-style:none;margin:0;padding:0;display:flex;align-items:center;flex-wrap:nowrap;gap:2px;font-size:11.5px;color:var(--sa-muted);white-space:nowrap;overflow:hidden}
  .sa-bc li{display:inline-flex;align-items:center;min-width:0}
  .sa-bc li+li::before{content:'›';margin:0 5px;opacity:.7}
  .sa-bc a{color:var(--text-secondary);text-decoration:none}
  .sa-bc a:hover{color:var(--text-primary);text-decoration:underline}
  .sa-bc [aria-current]{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis}
  .sa-search{position:relative;flex:1;max-width:460px;margin-left:auto}
  .sa-search input{width:100%;padding:8px 12px 8px 34px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text-primary);font-size:13px}
  .sa-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--sa-muted)}
  .sa-pop{position:absolute;top:calc(100% + 6px);right:0;min-width:300px;max-width:min(420px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);z-index:80;padding:6px}
  .sa-search .sa-pop{left:0;right:auto;width:100%}
  .sa-pop-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sa-muted)}
  .sa-pop-item{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;cursor:pointer;width:100%;background:none;border:0;color:var(--text-primary);text-align:left;font-size:13px}
  .sa-pop-item:hover,.sa-pop-item:focus{background:var(--surface-hover)}
  .sa-pop-item small{display:block;color:var(--sa-muted);font-size:11.5px}
  .sa-iconbtn{position:relative;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:var(--surface);border:1px solid var(--border);color:var(--text-secondary);cursor:pointer;flex-shrink:0}
  .sa-iconbtn:hover{color:var(--text-primary);border-color:var(--border-hover)}
  .sa-iconbtn svg{width:18px;height:18px}
  .sa-badge-count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--danger);color:var(--on-primary);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg-primary)}
  .sa-health{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap}
  .sa-dot{width:8px;height:8px;border-radius:50%;background:var(--sa-muted);display:inline-block;flex-shrink:0}
  .sa-dot.ok{background:var(--success)}.sa-dot.warn{background:var(--warning)}.sa-dot.err,.sa-dot.down{background:var(--danger)}.sa-dot.info{background:var(--info)}
  .sa-profile-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:10px;padding:3px 6px;cursor:pointer;color:var(--text-primary)}
  .sa-profile-btn:hover{border-color:var(--border)}
  .sa-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--on-primary);font-size:13px}
  .sa-rel{position:relative}
  .sa-imp{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 20px;background:var(--warning-soft);border-bottom:1px solid var(--warning-border);color:var(--warning-text);font-size:13px}
  .sa-content{padding:20px;max-width:1500px;width:100%;margin:0 auto;flex:1}

  /* ── Page pieces ─────────────────────────────────────── */
  .sa-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .sa-head h1{margin:0;font-size:21px;font-weight:750;letter-spacing:-.015em;line-height:1.25}
  .sa-head h1:focus{outline:none}
  .sa-head-text{min-width:0;flex:1 1 320px}
  .sa-head p{margin:4px 0 0;color:var(--text-secondary);font-size:13px;max-width:820px}
  .sa-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sa-grid{display:grid;gap:12px}
  .sa-kpis{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  .sa-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sa-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sa-card{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:14px;padding:16px;min-width:0}
  .sa-card h3{margin:0 0 10px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .sa-card h3 .sa-link{font-weight:500;font-size:12px}
  .sa-kpi{background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:12px;padding:14px 16px;cursor:default;min-width:0;text-align:left;color:inherit;font:inherit;width:100%;position:relative;overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s}
  .sa-kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent);opacity:.45}
  button.sa-kpi{cursor:pointer}
  button.sa-kpi:hover{border-color:var(--border-hover);transform:translateY(-1px);box-shadow:var(--glow)}
  .sa-kpi .k{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--sa-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
  .sa-kpi .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
  .sa-kpi .v.v-multi{font-size:16px;line-height:1.3;display:flex;flex-wrap:wrap;gap:0 10px}
  .sa-kpi .s{font-size:12px;color:var(--text-secondary);margin-top:3px;display:flex;align-items:center;gap:6px}
  .sa-kpi.warn{border-color:var(--warning-border)}.sa-kpi.bad{border-color:var(--danger-border)}
  /* KPI icon tile inside stat card */
  .sa-kpi-icon{
    width:36px;height:36px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;float:right;margin:-2px -2px 4px 8px;
  }
  .sa-kpi-icon svg{width:18px;height:18px}
  .sa-kpi-icon.violet{background:var(--kpi-violet);color:var(--kpi-violet-text)}
  .sa-kpi-icon.blue{background:var(--kpi-blue);color:var(--kpi-blue-text)}
  .sa-kpi-icon.green{background:var(--kpi-green);color:var(--kpi-green-text)}
  .sa-kpi-icon.amber{background:var(--kpi-amber);color:var(--kpi-amber-text)}
  .sa-kpi-icon.pink{background:var(--kpi-pink);color:var(--kpi-pink-text)}
  .sa-kpi-icon.teal{background:var(--kpi-teal);color:var(--kpi-teal-text)}
  .sa-section{margin-top:16px}
  .sa-muted{color:var(--sa-muted)}
  .sa-small{font-size:12px}
  .sa-mono{font-family:var(--font-mono);font-size:12px}
  .sa-link{color:var(--text-link);cursor:pointer;background:none;border:0;padding:0;font:inherit;text-decoration:none}
  .sa-link:hover{text-decoration:underline}
  .sa-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sa-spacer{flex:1}

  .sa-filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .sa-filters .form-input,.sa-filters .form-select{width:auto;min-width:140px;padding:7px 10px;font-size:13px}
  .sa-filters .sa-grow{flex:1;min-width:180px}
  /* table tools (extra buttons, Columns, Export) stay together on the right when the filter row wraps */
  .sa-tools{display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
  .sa-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .sa-chip{padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text-secondary);font-size:12.5px;cursor:pointer}
  .sa-chip.active{background:var(--primary-light);border-color:var(--primary);color:var(--text-primary)}
  .sa-chip b{margin-left:4px}

  .sa-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--glass-bg)}
  table.sa-table{width:100%;border-collapse:collapse;font-size:13px}
  .sa-table th{padding:9px 12px;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--sa-muted);background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap}
  .sa-table th[data-sort]{cursor:pointer;user-select:none}
  .sa-table th[data-sort]:hover{color:var(--text-primary)}
  .sa-table td{padding:9px 12px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
  .sa-table tr:last-child td{border-bottom:0}
  .sa-table tbody tr:hover{background:var(--surface-hover)}
  .sa-table tr.clickable{cursor:pointer}
  .sa-table .num{text-align:right;font-variant-numeric:tabular-nums}
  .sa-table .cell-main{font-weight:600}
  .sa-table .cell-sub{display:block;font-size:11.5px;color:var(--sa-muted)}
  .sa-table .row-actions{display:flex;gap:4px;justify-content:flex-end;flex-wrap:nowrap}
  .sa-table input[type=checkbox]{accent-color:var(--primary);width:15px;height:15px}
  .sa-bulk{display:flex;gap:8px;align-items:center;padding:8px 12px;margin-bottom:8px;border-radius:10px;background:var(--primary-light);border:1px solid var(--border-hover);font-size:13px}
  .sa-pager{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--text-secondary)}
  .btn-xs{padding:4px 9px;font-size:12px;border-radius:7px}
  .btn[disabled]{opacity:.5}


  .sa-state{padding:40px 16px;text-align:center;color:var(--text-secondary)}
  .sa-state .ico{font-size:34px;opacity:.55;margin-bottom:6px}
  .sa-state h4{margin:0 0 4px;color:var(--text-primary);font-size:15px}
  .sa-state p{margin:0 auto 12px;max-width:420px;font-size:13px}
  .sa-skel{display:grid;gap:10px}
  .sa-skel .skeleton{height:14px}
  .sa-skel .skeleton.tall{height:90px;border-radius:12px}

  .sa-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
  /* wide screens: long tab bars wrap onto a second row instead of hiding tabs off the right edge */
  @media (min-width:641px){.sa-tabs{flex-wrap:wrap;overflow-x:visible}}
  .sa-tab{padding:9px 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--sa-muted);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
  .sa-tab:hover{color:var(--text-primary)}
  .sa-tab.active{color:var(--text-primary);border-bottom-color:var(--primary)}

  .sa-kv{display:grid;grid-template-columns:minmax(110px,max-content) minmax(0,1fr);gap:6px 14px;font-size:13px}
  .sa-kv dt{color:var(--sa-muted)}
  .sa-kv dd{margin:0;overflow-wrap:anywhere}
  .sa-feed{list-style:none;margin:0;padding:0}
  .sa-feed li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:13px;align-items:flex-start}
  .sa-feed li:last-child{border-bottom:0}
  .sa-feed .when{margin-left:auto;color:var(--sa-muted);font-size:11.5px;white-space:nowrap}
  .sa-chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
  .sa-chain .node{padding:6px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px}
  .sa-chain .node b{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sa-muted)}
  .sa-chain .arrow{color:var(--sa-muted)}
  .sa-chain .node.bad{border-color:var(--danger-border);background:var(--danger-soft)}
  .sa-bar{height:6px;border-radius:999px;background:var(--surface-active);overflow:hidden;min-width:60px}
  .sa-bar > i{display:block;height:100%;background:var(--primary);border-radius:999px}
  .sa-bar.warn > i{background:var(--warning)}.sa-bar.bad > i{background:var(--danger)}
  .sa-toggle{position:relative;display:inline-block;width:40px;height:22px;flex-shrink:0}
  .sa-toggle input{opacity:0;width:0;height:0;position:absolute}
  .sa-toggle span{position:absolute;inset:0;border-radius:999px;background:var(--surface-active);border:1px solid var(--border);transition:.15s;cursor:pointer}
  .sa-toggle span::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--text-secondary);transition:.15s}
  .sa-toggle input:checked + span{background:var(--primary);border-color:var(--primary)}
  .sa-toggle input:checked + span::after{transform:translateX(18px);background:var(--on-primary)}
  .sa-toggle input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
  .sa-flag{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border-subtle)}
  .sa-flag:last-child{border-bottom:0}
  .sa-matrix td,.sa-matrix th{text-align:center}
  .sa-matrix td:first-child,.sa-matrix th:first-child{text-align:left}
  pre.sa-pre{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12px;overflow:auto;max-height:300px;white-space:pre-wrap;word-break:break-word;margin:0}

  /* charts */
  .sa-chart{position:relative}
  .sa-chart svg{display:block;width:100%;height:auto;overflow:visible}
  .sa-chart .tip{position:absolute;pointer-events:none;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;transform:translate(-50%,-110%);z-index:5}
  .sa-chart .total{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}

  /* modal & drawer */
  .sa-overlay{position:fixed;inset:0;background:var(--overlay);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
  .sa-modal{background:var(--bg-secondary);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  .sa-modal.lg{max-width:860px}
  .sa-modal header,.sa-drawer header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .sa-modal header h3,.sa-drawer header h3{margin:0;font-size:16px}
  .sa-modal .body{padding:16px 18px;overflow:auto;display:grid;gap:12px}
  .sa-modal footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
  .sa-drawer-wrap{position:fixed;inset:0;z-index:150;background:var(--overlay)}
  .sa-drawer{position:absolute;top:0;right:0;bottom:0;width:min(620px,100vw);background:var(--bg-secondary);border-left:1px solid var(--border);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
  .sa-drawer .body{padding:16px 18px;overflow:auto;flex:1}
  .sa-field{display:grid;gap:4px}
  .sa-field label{font-size:12.5px;font-weight:600;color:var(--text-secondary)}
  .sa-field .hint{font-size:11.5px;color:var(--sa-muted)}
  .sa-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .sa-check{display:flex;gap:8px;align-items:center;font-size:13px}
  .sa-check input{accent-color:var(--primary);width:15px;height:15px}
  .sa-err{color:var(--danger-text);font-size:12.5px}
  #toast-container .toast-msg{overflow-wrap:anywhere}

  /* ── Data table ── */
  .sa-table-wrap.sa-sticky{max-height:min(72vh,760px);overflow:auto}
  .sa-sticky .sa-table thead th{position:sticky;top:0;z-index:2;background:var(--bg-elevated);box-shadow:inset 0 -1px 0 var(--border)}
  .sa-table th[data-sort]{white-space:nowrap}
  .sa-sort{display:inline-block;margin-left:4px;opacity:.45;font-size:10px}
  .sa-table th[aria-sort=ascending] .sa-sort,.sa-table th[aria-sort=descending] .sa-sort{opacity:1;color:var(--text-link)}
  .sa-table th[data-sort]:focus-visible,.sa-table tr.clickable:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
  .sa-table tr[aria-selected=true] td{background:var(--primary-light)}
  .sa-table .sa-cb{width:36px}
  .sa-q{position:relative;display:flex;align-items:center}
  .sa-filters .sa-q{min-width:240px}
  .sa-q svg{position:absolute;left:10px;width:15px;height:15px;color:var(--sa-muted);pointer-events:none}
  .sa-filters .sa-q .form-input{width:100%;padding-left:32px}
  .sa-date{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sa-muted)}
  .sa-ico{width:15px;height:15px;flex-shrink:0}
  .sa-menu{min-width:240px;right:0;left:auto}
  .sa-menu-item{padding:6px 8px;border-radius:8px;cursor:pointer}
  .sa-menu-item:hover{background:var(--surface-hover)}
  .sa-pop-item small{display:block}
  .sa-lim{width:auto!important;padding:4px 8px!important;font-size:12px!important}
  .sa-pager b{color:var(--text-primary);font-weight:600}

  /* ── Charts ── */
  .sa-chart{margin:0;position:relative;border-radius:10px}
  .sa-chart:focus-visible{outline:2px solid var(--primary);outline-offset:4px}
  .sa-plot{display:flex;gap:8px;margin-top:14px}
  .sa-chart-foot .sa-link{font-size:12px}
  /* KPI labels wrap (max two lines) instead of being cut off with "…" */
  .sa-kpi > .k,.sa-kpi > .k span{white-space:normal;overflow:visible;text-overflow:clip;min-width:0}
  .sa-kpi > .k{align-items:flex-start;line-height:1.35}
  .sa-kpi .k span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word}
  .sa-kpi .k .sa-ico{margin-top:.5px}
  /* clickable KPI cards: content starts at the top like the plain ones (buttons centre it by default) */
  button.sa-kpi{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
  .sa-yaxis{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;font-size:10.5px;color:var(--sa-muted);font-variant-numeric:tabular-nums;min-width:28px;margin:-6px 0}
  .sa-area{position:relative;flex:1;min-width:0}
  .sa-grid-l{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
  .sa-grid-l i{display:block;border-top:1px dashed var(--border-subtle)}
  .sa-grid-l i:last-child{border-top:1px solid var(--border)}
  .sa-cols{position:absolute;inset:0;display:flex;align-items:stretch;gap:2px}
  .sa-cols.dense{gap:0}
  .sa-cols .c{flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:center;cursor:crosshair;border-radius:4px}
  .sa-cols .c i{display:block;width:100%;max-width:22px;background:var(--primary);border-radius:3px 3px 0 0;opacity:.85;transition:opacity .12s}
  .sa-cols.dense .c i{border-radius:1px 1px 0 0}
  .sa-cols .c:hover,.sa-cols .c.on{background:var(--surface-hover)}
  .sa-cols .c.on i,.sa-cols .c:hover i{opacity:1}
  .sa-xaxis{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:var(--sa-muted);margin:6px 0 0 36px}
  .sa-chart-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .sa-chart-table{margin-top:8px;max-height:240px;overflow:auto;border:1px solid var(--border);border-radius:10px}
  .sa-chart .tip{transform:translate(-50%,calc(-100% - 8px))}
  .sa-barlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .sa-barlist li{display:grid;grid-template-columns:minmax(90px,32%) 1fr auto;gap:10px;align-items:center;font-size:13px}
  .sa-barlist .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sa-stack{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px;background:var(--surface);margin:4px 0 12px}
  .sa-stack i{display:block;height:100%;min-width:3px}
  .sa-stack i[data-tone=success]{background:var(--success)}.sa-stack i[data-tone=warning]{background:var(--warning)}
  .sa-stack i[data-tone=danger],.sa-stack i[data-tone=suspended]{background:var(--danger)}.sa-stack i[data-tone=neutral]{background:var(--sa-muted)}
  .sa-stack i[data-tone=primary]{background:var(--primary)}.sa-stack i[data-tone=running],.sa-stack i[data-tone=info]{background:var(--info)}

  /* ── States ── */
  .sa-state .ico{width:52px;height:52px;margin:0 auto 10px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--border);color:var(--sa-muted);opacity:1;font-size:0}
  .sa-state .ico svg{width:24px;height:24px}
  .sa-state .ico[data-tone=danger]{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger-text)}
  .sa-state .ico[data-tone=warning]{background:var(--warning-soft);border-color:var(--warning-border);color:var(--warning-text)}

  /* ── KPI + dashboard polish ── */
  .sa-kpi{position:relative;overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s}
  .sa-kpi::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--primary),transparent);opacity:.55}
  .sa-kpi.warn::before{background:var(--warning);opacity:.9}.sa-kpi.bad::before{background:var(--danger);opacity:.9}
  button.sa-kpi:hover{transform:translateY(-1px);box-shadow:var(--glow)}
  button.sa-kpi:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .sa-kpi .k{display:flex;align-items:center;gap:6px}
  .sa-kpi .k .sa-ico{width:14px;height:14px;color:var(--text-link)}
  .sa-kpi.warn .k .sa-ico{color:var(--warning-text)}.sa-kpi.bad .k .sa-ico{color:var(--danger-text)}
  .sa-kpi .go{position:absolute;right:10px;top:10px;opacity:.55;color:var(--sa-muted);transition:opacity .15s,color .15s,transform .15s;font-size:12px;line-height:1}
  button.sa-kpi .k{padding-right:14px}
  button.sa-kpi:hover .go,button.sa-kpi:focus-visible .go{opacity:1;color:var(--text-link);transform:translateX(2px)}
  button.sa-kpi:hover .k{color:var(--text-link)}
  .sa-kpi .v.v-status{font-size:16px;display:flex;align-items:center;gap:6px}
  @media (prefers-reduced-motion: reduce){button.sa-kpi:hover,button.sa-kpi:hover .go{transform:none}}
  .sa-attn{list-style:none;margin:0;padding:0;display:grid;gap:6px}
  .sa-attn a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-primary);text-decoration:none;font-size:13px}
  .sa-attn a:hover{border-color:var(--border-hover);background:var(--surface-hover)}
  .sa-attn .n{font-weight:800;font-variant-numeric:tabular-nums;min-width:28px}
  .sa-attn .sa-dot{flex-shrink:0}
  .sa-attn .arr{margin-left:auto;color:var(--sa-muted)}
  .sa-ok-line{display:flex;align-items:center;gap:8px;color:var(--success-text);font-size:13px;padding:8px 0}
  a.sa-chip{text-decoration:none}
  .sa-span2{grid-column:span 2}
  .sa-2.sa-ticket{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
  /* API coverage price grid (all included / own Apify / own Gemini / both) */
  .sa-pgrid tbody th{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--text-primary);background:none;border-bottom:1px solid var(--border-subtle);white-space:normal}
  .sa-pgrid tbody tr:last-child th{border-bottom:0}
  .sa-pgrid tr.sa-cov-cur th,.sa-pgrid tr.sa-cov-cur td{background:var(--primary-light)}
  /* API keys page: LeadAI's keys + customers' own keys (masked hints only) */
  .sa-pk-kpis{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
  .sa-pk-head{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap;margin:20px 0 10px}
  .sa-pk-head h2{margin:0;font-size:15px;font-weight:700}
  .sa-pk-head:focus{outline:none}
  .sa-pk-head:focus-visible{outline:2px solid var(--primary);outline-offset:4px;border-radius:6px}
  .sa-pk-card.bad{border-color:var(--danger-border)}
  .sa-pk-card .alert{margin-bottom:10px}
  .sa-pk-bad{color:var(--danger-text)}
  .sa-pk-err{display:inline-flex;cursor:help}
  .sa-keyin{display:flex;gap:6px}
  .sa-keyin .form-input{flex:1;min-width:0}
  .sa-filters .sa-chips{margin:0}
  .sa-pk-table td{vertical-align:top}
  .sa-pk-api{display:grid;gap:6px;min-width:0}
  .sa-pk-line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .sa-pk-acts{display:flex;flex-wrap:wrap;gap:4px}
  .sa-card[data-section]:focus{outline:none}
  .sa-card[data-section]:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .sa-chip:focus-visible,.sa-tab:focus-visible,.sa-item:focus-visible,.sa-group-btn:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
  .sa-back{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;margin-bottom:6px}
  /* link card (dashboard → Operations overview) */
  .sa-linkcard{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-primary);transition:border-color .15s,box-shadow .15s}
  .sa-linkcard:hover{border-color:var(--border-hover);box-shadow:var(--glow)}
  .sa-linkcard:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .sa-linkcard-ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--primary-light);color:var(--text-link);flex-shrink:0}
  .sa-linkcard-ico .sa-ico{width:19px;height:19px}
  .sa-linkcard-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
  .sa-linkcard-text b{font-size:14px}
  .sa-linkcard-text span{font-size:12.5px;color:var(--text-secondary)}
  .sa-linkcard .arr{color:var(--sa-muted);flex-shrink:0}
  .sa-pop-note{padding:10px 8px;font-size:12.5px;color:var(--sa-muted)}
  .sa-head .sa-actions .sa-rel .sa-pop{min-width:260px}
  .sa-content > div{animation:sa-in .18s ease}
  @keyframes sa-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ── Messaging (email + SMS) ── */
  .sa-msg-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
  .sa-msg-fs{border:0;margin:0 0 14px;padding:0;min-width:0}
  .sa-msg-fs legend{font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;padding:0}
  .sa-msg-groups{display:grid;gap:6px}
  .sa-msg-group{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer;font-size:13px;min-width:0}
  .sa-msg-group:hover{border-color:var(--border-hover)}
  .sa-msg-group:has(input:checked){border-color:var(--primary);background:var(--primary-light)}
  .sa-msg-group:has(input:focus-visible){outline:2px solid var(--primary);outline-offset:2px}
  .sa-msg-group input{accent-color:var(--primary);margin-top:3px;flex-shrink:0}
  .sa-msg-group small{display:block;color:var(--sa-muted);font-size:11.5px}
  .sa-msg-pick{position:relative}
  .sa-msg-pick .form-input{width:100%}
  .sa-msg-pick .sa-pop{left:0;right:auto;width:100%;min-width:0;max-width:none;max-height:min(360px,60vh)}
  .sa-msg-pick .sa-pop-item[disabled]{opacity:.55;cursor:default}
  .sa-msg-ph{margin-left:auto;flex-shrink:0;font-size:12px;align-self:center}
  .sa-msg-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .sa-msg-chips:empty{display:none}
  .sa-msg-chip{display:inline-flex;align-items:center;gap:8px;max-width:100%;min-width:0;padding:4px 4px 4px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-size:12.5px}
  .sa-msg-chip.warn{border-color:var(--warning-border);background:var(--warning-soft)}
  .sa-msg-chip > span{min-width:0;overflow:hidden}
  .sa-msg-chip b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sa-msg-chip small{display:block;color:var(--sa-muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sa-msg-chip button{flex-shrink:0;width:26px;height:26px;border-radius:7px;border:0;background:none;color:var(--sa-muted);cursor:pointer}
  .sa-msg-chip button:hover{background:var(--surface-hover);color:var(--text-primary)}
  .sa-msg-nophone{color:var(--warning-text);font-weight:600}
  .sa-msg-count{display:flex;justify-content:space-between;gap:4px 10px;flex-wrap:wrap;font-size:11.5px;color:var(--sa-muted);font-variant-numeric:tabular-nums}
  .sa-msg-count.over{color:var(--warning-text)}
  .sa-msg-prev{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;background:var(--surface);border:1px dashed var(--border);border-radius:10px;padding:8px 10px;margin:4px 0;color:var(--text-secondary);max-height:140px;overflow:auto}
  .sa-msg-bar{position:sticky;bottom:12px;z-index:5;margin-top:12px;display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;background:var(--bg-secondary);box-shadow:var(--shadow-lg)}
  .sa-msg-sum{flex:1 1 260px;min-width:0;font-size:13px}
  .sa-msg-sum b{font-size:15px}
  .sa-msg-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sa-msg-bar .sa-err{flex-basis:100%}
  .sa-msg-bar .sa-err:empty{display:none}
  .sa-msg-test{display:grid;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-subtle)}
  .sa-msg-test > label{font-size:12.5px;font-weight:600;color:var(--text-secondary)}
  .sa-msg-prov{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;font-size:12.5px;color:var(--text-secondary)}
  .sa-msg-prov b{color:var(--text-primary)}
  .sa-msg-3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sa-msg-h{margin:16px 0 8px;font-size:13px;font-weight:700}
  .sa-msg-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0}
  .sa-msg-stat{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface);font-size:12px;color:var(--text-secondary)}
  .sa-msg-stat b{display:block;font-size:13px;margin-bottom:2px;color:var(--text-primary)}
  .sa-msg-secret{display:inline-flex;align-items:center;margin-left:8px;font-size:11px;font-weight:700;color:var(--success-text)}
  @media (max-width:900px){.sa-msg-layout,.sa-msg-3{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:640px){.sa-msg-bar{position:static;box-shadow:none}.sa-msg-acts{width:100%}.sa-msg-acts .btn-primary{flex:1;justify-content:center}}

  /* ── Guide button (design/tour.js) in the top bar ── */
  .sa-topbar .lt-launch{flex-shrink:0}
  .sa-topbar .lt-launch-btn{height:36px;padding:0 12px 0 7px;border-radius:10px;background:var(--surface);border-color:var(--border);color:var(--text-secondary)}
  .sa-topbar .lt-launch-btn:hover{background:var(--surface-hover);border-color:var(--border-hover);color:var(--text-primary)}
  .sa-topbar .lt-launch-btn[aria-expanded="true"]{border-color:var(--primary);color:var(--text-primary)}
  .sa-topbar .lt-menu{background:var(--bg-secondary);border-color:var(--border)}
  @media (max-width:1100px){.sa-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:900px){
    .sa-sidebar{transform:translateX(-100%);width:252px!important}
    body.sa-nav-open .sa-sidebar{transform:none}
    body.sa-nav-open::after{content:'';position:fixed;inset:0;background:var(--overlay);z-index:55}
    .sa-main,body.sa-collapsed .sa-main{margin-left:0}
    body.sa-collapsed .sa-label,body.sa-collapsed .sa-brand-text,body.sa-collapsed .sa-group-btn span{display:initial}
    .sa-burger{display:inline-flex}
    #saCollapse{display:none}
    .sa-2,.sa-3{grid-template-columns:minmax(0,1fr)}
    .sa-span2{grid-column:auto}
    .sa-2.sa-ticket{grid-template-columns:minmax(0,1fr)}
    .sa-health .lbl{display:none}
  }
  @media (max-width:640px){
    .sa-topbar{padding:8px 12px;gap:6px;flex-wrap:wrap}
    .sa-search{order:10;flex-basis:100%;max-width:none}
    .sa-content{padding:14px 12px}
    .sa-profile-meta{display:none}
    .sa-form-grid{grid-template-columns:minmax(0,1fr)}
    .sa-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sa-bc{display:none}
    .sa-crumbs{flex:1 1 0;min-width:0}
    /* phone: the GLOBAL badge sits under the page name so the name is not cut off */
    .sa-tb-title{flex-direction:column;align-items:flex-start;gap:1px}
    #saTitle{max-width:100%;line-height:1.25}
    .sa-global-tb{font-size:9px;padding:0 6px;letter-spacing:.1em}
    .sa-topbar > [data-theme-toggle]{display:none}
    .sa-profile-btn{padding:3px}
    .sa-filters .form-select,.sa-filters .sa-q{flex:1 1 140px;min-width:0}
    .sa-head h1{font-size:19px}
    /* API keys table: one card per organization */
    .sa-pk-table thead{display:none}
    .sa-pk-table,.sa-pk-table tbody,.sa-pk-table tr,.sa-pk-table td{display:block;width:100%}
    .sa-pk-table tr{padding:10px 12px;border-bottom:1px solid var(--border)}
    .sa-pk-table tr:last-child{border-bottom:0}
    .sa-pk-table td{border:0;padding:5px 0}
    .sa-pk-table td[data-label]::before{content:attr(data-label);display:block;margin-bottom:3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sa-muted)}
    .sa-filters .sa-chips{flex-basis:100%}
    .sa-pk-kpis{grid-template-columns:minmax(0,1fr)}
    /* the guide menu opens under the whole top bar, not off the left edge */
    .sa-topbar .lt-launch{position:static}
    .sa-topbar .lt-launch-btn{width:36px;padding:0;justify-content:center}
    .sa-topbar .lt-menu{right:12px;top:calc(100% + 4px)}
  }
</style>
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div class="sa-shell">
  <aside class="sa-sidebar" id="saSidebar" aria-label="Super Admin navigation">
    <div class="sa-brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5L8 13.8 2 9.2h7.6z"/></svg></span>
      <div class="sa-brand-text">
        <div class="sa-brand-name" data-brand-name>LeadAI</div>
        <span class="sa-global" id="saRoleBadge" title="You are acting across ALL organizations">GLOBAL</span>
      </div>
    </div>
    <nav class="sa-nav" id="saNav"></nav>
    <div class="sa-foot">
      <button class="sa-item" id="saCollapse" type="button" aria-label="Collapse sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg><span class="sa-label">Collapse sidebar</span></button>
      <button class="sa-item" id="saLogout" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span class="sa-label">Sign out</span></button>
    </div>
  </aside>

  <div class="sa-main">
    <header class="sa-topbar">
      <button class="sa-iconbtn sa-burger" id="saBurger" type="button" aria-label="Open navigation" aria-controls="saSidebar" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
